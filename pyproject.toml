[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fastocr-mcp"
dynamic = ["version"]
description = "MCP server for the FastOCR Document OCR API: OCR scanned PDFs into text or searchable PDFs from Claude, Cursor and other MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "ocr", "pdf", "searchable-pdf", "ai-agents", "fastocr"]
authors = [
    { name = "FastOCR", email = "support@fastocr.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "fastocr-sdk>=0.3.0,<0.4",
    "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "jsonschema>=4.20.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
fastocr-mcp = "fastocr_mcp.server:main"

[project.urls]
Homepage = "https://fastocr.org"
Documentation = "https://fastocr.org/docs"
Repository = "https://github.com/fastocr-org/fastocr-mcp"
Changelog = "https://github.com/fastocr-org/fastocr-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/fastocr-org/fastocr-mcp/issues"

[tool.hatch.version]
path = "src/fastocr_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fastocr_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "server.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
